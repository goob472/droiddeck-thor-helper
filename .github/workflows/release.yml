name: Build and release APK

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, in push order, so the newest build is always the Latest release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up signing
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=ddhelper"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > signing.properties

      - name: Test and build
        run: |
          chmod +x gradlew
          VERSION="1.0.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # Only the helper app is built and released; :fakedroiddeck is an emulator test fixture.
          ./gradlew --no-daemon :app:testReleaseUnitTest :app:assembleRelease \
            -PversionCode=${{ github.run_number }} -PversionName=$VERSION
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/DDThorHelper-v$VERSION.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(git log -1 --pretty=%B)
          gh release create "v$VERSION" "out/DDThorHelper-v$VERSION.apk" \
            --title "v$VERSION" --notes "$NOTES" --target "$GITHUB_SHA"
